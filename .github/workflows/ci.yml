name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 22.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Diagnose formatting differences
        if: failure()
        run: |
          npm run format
          git diff -- src

  android-release:
    name: Android Release Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

  ios-sim:
    name: iOS Simulator Debug
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build simulator
        run: |
          workspace=(ios/*.xcworkspace)
          scheme="$(basename "${workspace[0]}" .xcworkspace)"
          xcodebuild -workspace "${workspace[0]}" -scheme "$scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
